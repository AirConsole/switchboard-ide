# ide-n-dream's private tmux server config.
#
# Loaded explicitly with `-f`, on a private socket, so the IDE never inherits or
# disturbs the user's own tmux server and always gets exactly these settings.
# Every line here was verified against tmux 3.3a; comments record *why*, because
# most of these are non-obvious and several were measured to be load-bearing.

# --- fidelity: the browser terminal must see what the app emits -------------
# Inner TERM. tmux-256color is present in this box's terminfo.
set  -s  default-terminal "tmux-256color"

# The outer terminal is xterm.js (we spawn our attaching pty with
# TERM=xterm-256color). Without the RGB feature tmux DOWNGRADES 24-bit colour to
# the 256 palette -- measured: \e[38;2;10;200;30m arrived as \e[38;5;40m.
# COLORTERM=truecolor does NOT help; tmux 3.3a probes the terminal instead.
# This is an array option and each entry needs its own pattern, so it is one
# colon-joined entry appended to tmux's built-in defaults.
set  -sa terminal-features ",xterm*:RGB:extkeys:clipboard:usstyle:strikethrough:overline:focus:title:ccolour:cstyle"
# Deliberately NOT advertised: `sync` (3.3a emits the legacy DCS form, not
# DECSET 2026, which xterm.js would not understand), `margins` (makes tmux send
# DECLRMM), and `hyperlinks` (does not exist until tmux 3.4).

# Extended keys. Claude Code requests modifyOtherKeys level 2 (\e[>4;2m) at
# startup; with extended-keys off, Shift+Enter is delivered as ZERO bytes.
# With this on, tmux hands the app \e[13;2u. This is what makes Shift+Enter work.
set  -s  extended-keys on

# Let inner apps emit escape sequences tmux does not understand (tmux 3.3+).
set  -g  allow-passthrough on
set  -s  set-clipboard on
set  -s  focus-events on

# Mouse OFF on purpose: SGR mouse reports then reach the inner app (Claude Code,
# htop) instead of tmux stealing them for its own copy mode. Verified to pass
# through in both directions.
set  -g  mouse off

# Not cosmetic: with a status line a 40-row client leaves the app only 39 rows,
# which shows up as off-by-one geometry bugs everywhere.
set  -g  status off

# Default is 500ms, which delays every ESC keypress reaching the app.
set  -s  escape-time 0

# The browser owns every keystroke. Without this, tmux swallows C-b (and its
# whole key table) before the app -- fatal for vim, emacs and Claude Code.
# An external guest detaches by closing their terminal, or with
# `detach-client -t <name>`, rather than a prefix key.
set  -g  prefix None
unbind-key -a

# --- persistence: sessions outlive the IDE process --------------------------
# Our attaching pty goes away on every server restart; sessions must not.
set  -g  destroy-unattached off
set  -g  detach-on-destroy off
# Default (on) kills the tmux server when the last session closes, which would
# invalidate the socket underneath us.
set  -s  exit-empty off

# Keep dead panes so the user can read *why* claude exited (pane_dead_status)
# and respawn in place. With the default (off) the session evaporates instantly
# and the evidence is gone.
set  -g  remain-on-exit on

# Applied at pane creation, not retroactively, so it must be set before any
# session is created -- which it is, since this file is loaded with -f.
set  -g  history-limit 50000

# We re-assert size from the authoritative client instead.
set  -g  aggressive-resize off
setw -g  automatic-rename off
set  -g  base-index 0
setw -g  pane-base-index 0
