<!--
  Switchboard's mark: the three states an agent can be in, as one slab.

  Amber is blocked on you, green is done, and grey between them is everything
  else. Those are the only colours this interface spends, and here they are
  drawn the way the tab strip draws a project: square segments inside one
  rounded shell, seamed in the ground colour. Square segments in one shell are
  one object divided, which is the strongest grouping there is without colour,
  and it is also what stops three vertical stripes reading as a national flag.

  Grey is in the middle so the two state colours sit apart at the edges. At a
  16px favicon the grey and its two seams nearly close up, and the mark reads
  as amber and green with a dark gap: that is expected, and it is still the
  most legible thing in a tab strip of the alternatives drawn.

  The icon is the same at all times. What a worktree is doing is said in the
  document title instead (see `titleFor` in web/src/selectors.ts), because an
  installed app's dock icon comes from the manifest and never changes.

  The values are literal because an SVG served as a file has no stylesheet to
  read them from, so they have to be kept in step with :root in
  web/src/styles.css by hand. The ground is `ink` (#10141a), amber is `signal`
  (#ffb454) and green is `done` (#4ade80). The grey (#4a5566) is the one
  value that is not a token: `level-lit` measured 1.93:1 against the seams and
  merged into them at small sizes, and this is 2.45:1.

  (Written without the leading double hyphen those properties really carry: an
  XML comment may not contain two hyphens in a row.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <clipPath id="shell"><rect width="512" height="512" rx="112" /></clipPath>
  <g clip-path="url(#shell)">
    <rect width="512" height="512" fill="#10141a" />
    <rect width="160" height="512" fill="#ffb454" />
    <rect x="176" width="160" height="512" fill="#4a5566" />
    <rect x="352" width="160" height="512" fill="#4ade80" />
  </g>
</svg>
