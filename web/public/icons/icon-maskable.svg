<!--
  The same mark, drawn for a platform that will crop it. See icon.svg for what
  the mark means and why the colours are literal.

  One difference, and it is required rather than stylistic: no rounded shell.
  A maskable icon's corners belong to the platform, which crops to a circle, a
  squircle or a rounded square depending on the launcher, and rounding them
  here leaves that mask cutting inside our own radius, which reads as a double
  border.

  Nothing needs shrinking into Chrome's safe zone (a centred circle of 80%
  diameter, radius 204.8 at this size), because the mark is stripes rather
  than an object: every segment runs the full height, so any crop of the
  middle still shows all three. The narrowest case is the circle, where the
  outer segments keep 51 to 160 and 352 to 461 across the centre line.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#10141a" />
  <rect width="160" height="512" fill="#ffb454" />
  <rect x="176" width="160" height="512" fill="#4a5566" />
  <rect x="352" width="160" height="512" fill="#4ade80" />
</svg>
